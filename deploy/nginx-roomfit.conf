# Nginx 서브도메인 설정 예시
# 1) roomfit.example.com 을 실제 도메인으로 바꾼다
# 2) sudo cp deploy/nginx-roomfit.conf /etc/nginx/sites-available/roomfit
#    sudo ln -s /etc/nginx/sites-available/roomfit /etc/nginx/sites-enabled/roomfit
#    sudo nginx -t && sudo systemctl reload nginx
# 3) HTTPS: sudo certbot --nginx -d roomfit.example.com
server {
    listen 80;
    server_name roomfit.example.com;

    client_max_body_size 20m;   # 이후 GLB·사진 업로드 대비

    location / {
        proxy_pass http://127.0.0.1:3100;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }
}
